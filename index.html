<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>图片转PDF工具</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>图片转PDF工具</h1>
            <p>上传图片文件，轻松转换为PDF文档</p>
        </header>

        <main>
            <div class="upload-section">
                <div class="upload-area" id="uploadArea">
                    <div class="upload-content">
                        <svg class="upload-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                            <polyline points="17 8 12 3 7 8"></polyline>
                            <line x1="12" y1="3" x2="12" y2="15"></line>
                        </svg>
                        <h3>拖拽图片到此处或点击上传</h3>
                        <p>支持 JPG, PNG, GIF, BMP 格式</p>
                        <p class="mobile-tip" style="display: none;">💡 苹果用户：点击后在相册中多选照片 | 安卓用户：支持批量选择</p>
                        <input type="file" id="fileInput" accept="image/*" multiple hidden>
                        <input type="file" id="iosFileInput" accept="image/*" multiple hidden>
                        <input type="file" id="androidFileInput" accept="image/*" multiple hidden>
                    </div>
                </div>
            </div>

            <div class="preview-section" id="previewSection" style="display: none;">
                <h3>已上传的图片</h3>
                <div class="image-grid" id="imageGrid"></div>
                <div class="controls">
                    <button class="btn btn-secondary" id="clearBtn">清空图片</button>
                    <button class="btn btn-primary" id="convertBtn">转换为PDF</button>
                </div>
            </div>

            <div class="progress-section" id="progressSection" style="display: none;">
                <h3>正在转换...</h3>
                <div class="progress-bar">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
            </div>
        </main>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
